<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Strike Night Bowling</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1530;--cream:#fff8e8;--orange:#ff8a1f;--pink:#ff4f9a;--gold:#ffcc1f;--teal:#19c2c9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#241a44;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .pill{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:5px 9px;font-weight:600}
  #top{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;pointer-events:none}
  #card{pointer-events:auto;padding:4px 6px 5px}
  #cardHead{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin:0 2px 3px}
  #cardHead b{font-size:15px}
  .frames{display:grid;grid-template-columns:repeat(9,1fr) 1.45fr;border:2px solid var(--ink);border-radius:7px;overflow:hidden;background:#fff}
  .fr{border-right:1.5px solid var(--ink);min-width:0}
  .fr:last-child{border-right:none}
  .fr.cur{background:#fff1b8}
  .marks{display:flex;justify-content:flex-end;height:17px;font-size:12.5px;font-weight:700;line-height:16px}
  .marks span{width:15px;text-align:center;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
  .marks span:first-child:not(:only-child){}
  .tot{text-align:center;font-size:12.5px;font-weight:700;height:17px;line-height:17px}
  .fnum{font-size:9px;opacity:.55;text-align:left;padding-left:2px;line-height:9px;height:9px}
  #others{font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  #others span{background:#efe6ff;border-radius:8px;padding:1px 7px}
  #topRow{display:flex;justify-content:space-between;gap:6px}
  .btnS{pointer-events:auto;font:600 13px 'Fredoka',sans-serif;color:var(--ink);padding:3px 10px;cursor:pointer}
  #msg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);font-size:44px;font-weight:700;color:#fff;letter-spacing:1px;
       text-shadow:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 5px 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .2s, transform .25s;text-align:center;white-space:nowrap}
  #msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #msg small{display:block;font-size:20px;letter-spacing:0}
  #bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;pointer-events:none;align-items:center}
  #hint{font-size:14px;text-align:center;max-width:430px;background:rgba(255,248,232,.94)}
  #hint b{color:#c2410c}
  #skipBtn{pointer-events:auto}
  .hidden{display:none !important}
  .overlay{position:fixed;inset:0;background:rgba(26,21,48,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
  .card{background:var(--cream);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:16px;max-width:430px;width:100%;max-height:92vh;overflow:auto}
  .card h1{margin:0;font-size:34px;line-height:1;color:var(--pink);text-shadow:2px 2px 0 var(--ink)}
  .card h2{margin:0 0 8px}
  .card p{margin:6px 0}
  .btn{display:block;width:100%;margin:8px 0 0;padding:11px;border:3px solid var(--ink);border-radius:14px;background:var(--orange);color:#fff;font:700 18px 'Fredoka',sans-serif;box-shadow:0 3px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer}
  .btn small{display:block;font-size:12.5px;font-weight:500;opacity:.95}
  .btn.alt{background:var(--teal)} .btn.pink{background:var(--pink)} .btn.grey{background:#8b86a3}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .chip{flex:1;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:7px 6px;font:600 14px 'Fredoka',sans-serif;color:var(--ink);box-shadow:0 2px 0 var(--ink);cursor:pointer;text-align:center}
  .chip.on{background:var(--gold)}
  input.name{width:100%;font:600 16px 'Fredoka',sans-serif;padding:8px;border:3px solid var(--ink);border-radius:12px;margin:3px 0}
  table.sc{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  table.sc td{border-bottom:1px solid rgba(0,0,0,.12);padding:4px}
  #stats{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));margin:auto;max-width:420px;font-size:13px;line-height:1.35;pointer-events:auto}
  #stats .r{display:flex;justify-content:space-between;gap:8px}
  .big{font-size:42px;font-weight:700;text-align:center;line-height:1.1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="top">
  <div id="topRow">
    <div class="pill" id="card" style="flex:1">
      <div id="cardHead"><span id="who"><b>Player</b></span><span id="frameTxt"></span></div>
      <div class="frames" id="frames"></div>
      <div id="others"></div>
    </div>
  </div>
  <div style="display:flex;gap:6px;justify-content:flex-end"><button class="pill btnS" id="menuBtn">☰ Menu</button></div>
</div>
<div id="msg"></div>
<div class="pill hidden" id="stats"></div>
<div id="bottom">
  <button class="pill btnS hidden" id="skipBtn">Skip ⏭</button>
  <div class="pill" id="hint"></div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>Strike Night</h1>
    <p style="margin:2px 0 10px;font-weight:600">🎳 Ten-pin bowling</p>
    <button class="btn" id="mSolo">Play<small>One player, ten frames</small></button>
    <button class="btn pink" id="mCpu">Versus CPU<small>Take on a rookie, a club bowler or a pro</small></button>
    <button class="btn alt" id="mPass">Pass &amp; play<small>2 to 4 players on one phone</small></button>
    <button class="btn grey" id="mPractice">Practice lane<small>Throw freely, see speed, revs and hook</small></button>
    <button class="btn" id="mOnline" style="background:#6b4fd8">🌐 Online<small>2 to 4 players on their own phones</small></button>
    <button class="btn grey" id="mBoard">🏆 Leaderboard</button>
    <button class="btn grey" id="mHow">How to bowl</button>
    <a class="btn grey" id="mFrisbee" href="../" style="text-decoration:none;text-align:center;background:#2f9e4a">🥏 Disc Golf &amp; ⛳ Golf<small>Back to the golf games</small></a>
    <div class="row" style="margin-top:10px"><button class="chip" id="hand">Right-handed</button><button class="chip" id="ring">Timing ring: on</button></div>
    <div class="row"><button class="chip" id="guide">Aim guide: on</button><button class="chip" id="sound">Sound: on</button></div>
    <p id="best" style="font-size:13px;opacity:.75;text-align:center"></p>
  </div>
</div>
<div class="overlay hidden" id="setup">
  <div class="card">
    <h2 id="setupTitle">Players</h2>
    <div id="setupBody"></div>
    <button class="btn" id="setupGo">Start</button>
    <button class="btn grey" id="setupBack">Back</button>
  </div>
</div>
<div class="overlay hidden" id="how">
  <div class="card">
    <h2 id="howTitle">How to bowl</h2>
    <div id="howBody" style="font-size:15px;line-height:1.45"></div>
    <div id="howDots" style="text-align:center;margin:8px 0;font-size:18px;letter-spacing:4px"></div>
    <div class="row"><button class="chip" id="howBack">Back</button><button class="chip on" id="howNext">Next</button></div>
  </div>
</div>
<div class="overlay hidden" id="end">
  <div class="card">
    <h2 id="endTitle">Game over</h2>
    <div id="endBody"></div>
    <button class="btn" id="endAgain">Play again</button>
    <p id="endWait" class="hidden" style="text-align:center;font-weight:600">Waiting for the host to start the next game…</p>
    <button class="btn grey" id="endMenu">Menu</button>
  </div>
</div>
<div class="overlay hidden" id="online">
  <div class="card">
    <h2>🌐 Online</h2>
    <div id="olStart">
      <input class="name" id="olName" maxlength="12" placeholder="Your name">
      <button class="btn" id="olHost">Host a game</button>
      <p style="text-align:center;margin:10px 0 2px;font-weight:600">or join with a code</p>
      <div class="row"><input class="name" id="olCode" maxlength="4" placeholder="CODE" style="flex:1;text-transform:uppercase;letter-spacing:4px;text-align:center"><button class="chip on" id="olJoin" style="flex:0 0 90px">Join</button></div>
    </div>
    <div id="olLobby" class="hidden">
      <p style="text-align:center;margin:0">Game code</p>
      <div class="big" id="olCodeShow" style="letter-spacing:6px">----</div>
      <table class="sc" id="olPlayers"></table>
      <button class="btn" id="olWhatsApp" style="background:#25d366">Invite on WhatsApp</button>
      <button class="btn alt" id="olMore">Share invite link</button>
      <div class="row" id="olSeries"></div>
      <button class="btn pink" id="olGo">Start game</button>
    </div>
    <p id="olStatus" style="font-size:14px;text-align:center;min-height:18px"></p>
    <button class="btn grey" id="olBack">Back</button>
  </div>
</div>
<div class="overlay hidden" id="board">
  <div class="card">
    <h2>🏆 High games</h2>
    <div class="row"><button class="chip on" data-bw="world">🌍 Everyone</button><button class="chip" data-bw="phone">📱 This phone</button></div>
    <table class="sc" id="boardList"></table>
    <p id="boardFoot" style="font-size:12px;opacity:.7"></p>
    <button class="btn grey" id="boardClose">Close</button>
  </div>
</div>
<div class="overlay hidden" id="pause">
  <div class="card">
    <h2>Paused</h2>
    <div id="pauseCard"></div>
    <button class="btn" id="pResume">Resume</button>
    <button class="btn alt" id="pHow">How to bowl</button>
    <button class="btn grey" id="pQuit">Quit to menu</button>
  </div>
</div>

<script>/*ENGINE*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script async src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
(function(){
const E = ENGINE, L = E.LANE, $ = id=>document.getElementById(id);
const SET_KEY = 'strikenight-settings', BEST_KEY = 'strikenight-best';
let settings = {hand:1, ring:true, guide:true, sound:true, names:['You','Player 2','Player 3','Player 4'], cpu:1};
try{ Object.assign(settings, JSON.parse(localStorage.getItem(SET_KEY)) || {}); }catch(e){}
const saveSettings = ()=>{ try{ localStorage.setItem(SET_KEY, JSON.stringify(settings)); }catch(e){} };
const esc = s=>String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ================= renderer & scene =================
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1f52');
scene.fog = new THREE.Fog('#2a1f52', 26, 46);
const camera = new THREE.PerspectiveCamera(52, 1, 0.05, 80);
const fx = $('fx'), fctx = fx.getContext('2d');
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = w < h ? 58 : 46; camera.updateProjectionMatrix();
  const d = Math.min(devicePixelRatio || 1, 2); fx.width = Math.round(w*d); fx.height = Math.round(h*d); fctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();

{ const envScene = new THREE.Scene(); envScene.background = new THREE.Color('#1b1436');
  const panel = (col, w, h, x, y, z, ry=0, rx=0)=>{ const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color:col, side:THREE.DoubleSide})); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); envScene.add(m); };
  for(let i=-2;i<=2;i++) panel('#fff6e0', 1.2, 6, i*2.4, 4, 0, 0, Math.PI/2);          // ceiling lights
  panel('#ff4f9a', 12, 0.5, 0, 2.5, -6); panel('#19c2c9', 12, 0.5, 0, 1.6, -6); panel('#ffcc1f', 0.4, 4, -6, 2, 0, Math.PI/2); panel('#7af0ff', 0.4, 4, 6, 2, 0, Math.PI/2);
  panel('#3a2b78', 14, 14, 0, -1, 0, 0, Math.PI/2);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(envScene, 0.02).texture; pm.dispose(); }
scene.add(new THREE.HemisphereLight('#fff4e6', '#2a1f52', 0.42));
const sun = new THREE.DirectionalLight('#ffffff', 0.55); sun.position.set(2, 8, 4); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); const sc = sun.shadow.camera; sc.left = -3; sc.right = 3; sc.top = 6; sc.bottom = -6; sc.near = 1; sc.far = 30;
scene.add(sun); scene.add(sun.target);
const pinLight = new THREE.SpotLight('#fff3dd', 2.2, 9, 0.55, 0.45, 1.2); pinLight.position.set(0, 2.6, -17.2); pinLight.target.position.set(0, 0, -18.7);
pinLight.castShadow = true; pinLight.shadow.mapSize.set(1024, 1024); pinLight.shadow.bias = -0.0004; scene.add(pinLight); scene.add(pinLight.target);

const toonGrad = (()=>{ const c = document.createElement('canvas'); c.width = 4; c.height = 1; const g = c.getContext('2d'); ['#777','#aaa','#ddd','#fff'].forEach((col,i)=>{ g.fillStyle = col; g.fillRect(i,0,1,1); }); const t = new THREE.CanvasTexture(c); t.minFilter = t.magFilter = THREE.NearestFilter; return t; })();
const toon = (color, o={})=>new THREE.MeshToonMaterial(Object.assign({color:new THREE.Color(color), gradientMap:toonGrad}, o));
const inkMat = new THREE.MeshBasicMaterial({color:'#1a1530', side:THREE.BackSide});
function outlined(geo, color, thick=0.02, o={}){
  const g = new THREE.Group(), m = new THREE.Mesh(geo, o.mat || toon(color, o.m || {}));
  m.castShadow = !!o.cast; m.receiveShadow = !!o.receive; g.add(m);
  if(thick > 0){ const ol = new THREE.Mesh(geo, inkMat); ol.scale.setScalar(1 + thick); g.add(ol); }
  g.userData.mesh = m; return g;
}

// ---- lane ----
function woodTexture(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 2048; const g = c.getContext('2d');
  for(let i=0;i<39;i++){ const x0 = i*512/39; const l = 46 + ((i*37) % 11) - 5; g.fillStyle = `hsl(29, 64%, ${l}%)`; g.fillRect(x0, 0, 512/39 + 1, 2048);
    for(let k=0;k<20;k++){ g.strokeStyle = `rgba(120,70,20,${0.05 + ((i*k) % 5)*0.01})`; g.beginPath(); const yy = (k*211 + i*97) % 2048; g.moveTo(x0, yy); g.bezierCurveTo(x0 + 4, yy + 60, x0 + 8, yy + 120, x0 + 12, yy + 200); g.stroke(); }
    g.fillStyle = 'rgba(90,50,15,.25)'; g.fillRect(x0, 0, 1, 2048); }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; t.encoding = THREE.sRGBEncoding; return t;
}
const woodTex = woodTexture();
function makeLane(xOff, main){
  const g = new THREE.Group();
  const laneLen = L.pit + 0.2, laneMat = new THREE.MeshStandardMaterial({map:woodTex, roughness:0.16, metalness:0.0, envMapIntensity:0.6, transparent:main, opacity:main ? 0.8 : 1});
  const lane = new THREE.Mesh(new THREE.PlaneGeometry(L.half*2, laneLen), laneMat); lane.rotation.x = -Math.PI/2; lane.position.set(0, 0, -laneLen/2 + 0.0); lane.receiveShadow = true; g.add(lane);
  // approach
  const app = new THREE.Mesh(new THREE.PlaneGeometry(L.half*2 + L.gutterW*2 + 0.1, 5), new THREE.MeshStandardMaterial({map:woodTex, roughness:0.5, color:'#b98552'})); app.rotation.x = -Math.PI/2; app.position.set(0, -0.001, 2.5); app.receiveShadow = true; g.add(app);
  // foul line
  const foul = new THREE.Mesh(new THREE.PlaneGeometry(L.half*2 + L.gutterW*2 + 0.1, 0.02), new THREE.MeshBasicMaterial({color:'#1a1530'})); foul.rotation.x = -Math.PI/2; foul.position.set(0, 0.002, 0); g.add(foul);
  // arrows and dots
  const arrowMat = new THREE.MeshBasicMaterial({color:'#2b1d0e'});
  for(let k=-3;k<=3;k++){
    const bx = k*5*L.board, z = -L.arrows - Math.abs(k)*0.3;
    const sh = new THREE.Shape(); sh.moveTo(0, 0.13); sh.lineTo(0.028, 0); sh.lineTo(-0.028, 0); sh.closePath();
    const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), arrowMat); m.rotation.x = -Math.PI/2; m.position.set(bx, 0.002, z); g.add(m);
  }
  for(const k of [-5,-4,-3,-2,2,3,4,5].map(v=>v*5 - Math.sign(v)*2)){ const m = new THREE.Mesh(new THREE.CircleGeometry(0.012, 10), arrowMat); m.rotation.x = -Math.PI/2; m.position.set(k*L.board, 0.002, -2.1); g.add(m); }
  // gutters
  for(const s of [-1, 1]){
    const gu = new THREE.Mesh(new THREE.CylinderGeometry(L.gutterW/2, L.gutterW/2, laneLen, 16, 1, true, -Math.PI/2, Math.PI), new THREE.MeshStandardMaterial({color:'#24262f', metalness:0.5, roughness:0.4, side:THREE.DoubleSide}));
    gu.rotation.x = Math.PI/2; gu.rotation.y = 0; gu.position.set(s*(L.half + L.gutterW/2), 0.0, -laneLen/2); gu.rotation.z = 0; gu.scale.set(1, 1, 0.5); gu.receiveShadow = true; g.add(gu);
    // capping / divider
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, laneLen + 4.6), new THREE.MeshStandardMaterial({color:'#3a2391', roughness:0.5})); cap.receiveShadow = true; cap.position.set(s*(L.half + L.gutterW + 0.08), 0.05, -laneLen/2 + 2.3); g.add(cap);
  }
  // pin deck (a bit lighter) and pit
  const deck = new THREE.Mesh(new THREE.PlaneGeometry(L.half*2, 1.2), new THREE.MeshStandardMaterial({map:woodTex, color:'#a86a32', roughness:0.35})); deck.rotation.x = -Math.PI/2; deck.position.set(0, 0.001, -L.len - 0.4); deck.receiveShadow = true; g.add(deck);
  const pit = new THREE.Mesh(new THREE.PlaneGeometry(L.half*2 + L.gutterW*2 + 0.3, 1.6), new THREE.MeshBasicMaterial({color:'#0d0a1a'})); pit.rotation.x = -Math.PI/2; pit.position.set(0, -0.2, -L.pit - 0.75); g.add(pit);
  // side walls of the pin deck (kickbacks)
  for(const s of [-1, 1]){ const kb = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.8, 2.6), new THREE.MeshStandardMaterial({color:'#120d26', roughness:0.7})); kb.position.set(s*(L.half + L.gutterW + 0.1), 0.4, -L.len - 0.6); g.add(kb); }
  // masking unit above the pins
  const mc = document.createElement('canvas'); mc.width = 512; mc.height = 128; const mg = mc.getContext('2d');
  const grd = mg.createLinearGradient(0,0,512,0); grd.addColorStop(0,'#ff4f9a'); grd.addColorStop(0.5,'#ffcc1f'); grd.addColorStop(1,'#19c2c9'); mg.fillStyle = grd; mg.fillRect(0,0,512,128);
  mg.fillStyle = 'rgba(255,255,255,.85)'; mg.font = '700 64px Fredoka, sans-serif'; mg.textAlign = 'center'; mg.fillText(main ? 'STRIKE NIGHT' : '★  ★  ★', 256, 88);
  const mt = new THREE.CanvasTexture(mc); mt.encoding = THREE.sRGBEncoding;
  const mask = new THREE.Mesh(new THREE.PlaneGeometry(L.half*2 + L.gutterW*2 + 0.35, 0.5), new THREE.MeshBasicMaterial({map:mt})); mask.position.set(0, 1.05, -L.len - 0.9); g.add(mask);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(L.half*2 + L.gutterW*2 + 0.35, 0.8), new THREE.MeshBasicMaterial({color:'#120d24'})); back.position.set(0, 0.4, -L.pit - 1.4); g.add(back);
  g.position.x = xOff;
  return g;
}
const LANE_GAP = L.half*2 + L.gutterW*2 + 0.32;
scene.add(makeLane(0, true));
{ const under = new THREE.Mesh(new THREE.PlaneGeometry(L.half*2, L.pit + 0.2), new THREE.MeshBasicMaterial({color:'#3b2410'})); under.rotation.x = -Math.PI/2; under.position.set(0, -0.75, -(L.pit + 0.2)/2); scene.add(under); }
for(const k of [-2,-1,1,2]) scene.add(makeLane(k*LANE_GAP, false));
// floor, walls, ceiling lights
{ const fl = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), toon('#3a2b78')); fl.rotation.x = -Math.PI/2; fl.position.set(0, -0.01, 8); scene.add(fl);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 8), new THREE.MeshBasicMaterial({color:'#0e0a1f'})); wall.position.set(0, 3, -L.pit - 1.6); scene.add(wall);
  for(let z=0; z>-20; z-=3.2){ const strip = new THREE.Mesh(new THREE.BoxGeometry(LANE_GAP*5, 0.04, 0.25), new THREE.MeshBasicMaterial({color:z%2 ? '#ff7ac0' : '#7af0ff'})); strip.position.set(0, 3.2, z); scene.add(strip); }
  // ball return and seating behind
  const ret = outlined(new THREE.BoxGeometry(0.5, 0.5, 0.9), '#ff4f9a', 0.02); ret.position.set(-(L.half + L.gutterW + 0.45), 0.25, 3.6); scene.add(ret);

function afterBall(knocked, standing){

// swipe → throw parameters (the cricket bowling idea: swipe up to the spot you want, bend it to hook, faster = quicker)
// a bowling swing: pull DOWN from the ball (backswing), then swipe UP the lane (forward swing) and let go.
// higher backswing + faster forward swing = more speed; where you let go = where it goes; bend the forward swing = hook
// launch direction from the direction of the forward swing: straight up the screen = straight down the lane;
// every 4° of swing angle turns the ball 1°. Bending the swing for hook doesn't change the launch line.
function swingAngle(a, end){ const sa = Math.atan2(end[0] - a[0], a[1] - end[1]); return Math.max(-0.09, Math.min(0.09, sa*0.25)); }
function analyseSwipe(pts){
  if(pts.length < 4) return {err:'none'};
  const y0 = pts[0][1];
  let lowI = 0; for(let i=1;i<pts.length;i++) if(pts[i][1] > pts[lowI][1]) lowI = i;
  const back = (pts[lowI][1] - y0)/innerHeight;
  const S = pts.slice(lowI), end = S[S.length-1], a = S[0];
  const fwd = (a[1] - end[1])/innerHeight;
  if(back < 0.03) return {err:'noback'};
  if(fwd < 0.08) return {err:'nofwd'};
  // speed of the forward swing near the release
  let j = S.length - 1; while(j > 0 && end[2] - S[j-1][2] < 130) j--;
  const q = S[j], dtm = Math.max(16, end[2] - q[2]), spd = Math.hypot(end[0] - q[0], end[1] - q[1])/dtm*1000/innerHeight;
  const cx = end[0] - a[0], cy = end[1] - a[1], cl = Math.hypot(cx, cy) || 1; let bulge = 0;
  for(const p of S){ const t = ((p[0]-a[0])*cx + (p[1]-a[1])*cy)/(cl*cl); if(t < 0.1 || t > 0.9) continue; const off = ((p[0]-a[0])*cy - (p[1]-a[1])*cx)/cl; if(Math.abs(off) > Math.abs(bulge)) bulge = off; }
  const bend = -bulge/cl;
  const ang = swingAngle(a, end);
  return {spd, bend, ang, back:Math.min(1, back/0.2)};
}
function paramsFromSwipe(s){
  // power: half from how far you pulled back, half from how fast you swung through
  const pw = Math.max(0, Math.min(1, 0.5*s.back + 0.5*Math.min(1, s.spd/4)));
  const V = 4.5 + 5.6*pw;
  const h = Math.max(-1, Math.min(1, s.bend*5.5));
  const axis = h*0.95, rpm = 90 + 300*Math.abs(h)*(0.75 + 0.25*pw);
  // release timing: let go as the ring closes
  let q = 1, timing = '';
  let foul = false;
  if(settings.ring){ const err = s.tLift - APPROACH; q = Math.max(0, 1 - Math.abs(err)/0.4); timing = Math.abs(err) < 0.08 ? 'perfect' : err < 0 ? 'early' : 'late';

// ---- CPU ----
function planCpu(p){
  const sk = p.cpu, gs = E.gameState(p.rolls), full = !p.left || p.left.length===10;
  let h = full ? 0.55 + (sk - 0.5)*0.4 : 0.12, V = 7.6 + sk*1.2;
  let tx = 0.075, startX = 0.28;
  if(!full){ // spare: aim the middle of what's left, straighter ball, cross-lane
    const ps = p.left.map(id=>E.SPOTS[id-1]); const front = ps.reduce((a,b)=>-a.z < -b.z ? a : b);
    tx = ps.reduce((s,q)=>s + q.x, 0)/ps.length*0.5 + front.x*0.5; startX = tx > 0 ? -0.15 : 0.25; }
  // find the angle that gets there
  const o = {x:startX, angle:0, speed:V, revs:(90 + 300*h)*Math.PI/30, axis:h*0.95};
  let lo = -0.09, hi = 0.09; for(let k=0;k<22;k++){ const m = (lo+hi)/2; o.angle = m; const r = E.simLine(o); const x = r.atPins ? r.atPins.x : (r.ball.gutter < 0 ? -1 : 1); if(x < tx) lo = m; else hi = m; } o.angle = (lo+hi)/2;
  // skill = accuracy
  const err = Math.pow(1 - sk, 1.3), gauss = ()=>(Math.random() + Math.random() + Math.random() - 1.5)/0.5;
  o.angle += gauss()*(err*0.024 + 0.0012) + (sk < 0.6 && Math.random() < 0.3 ? gauss()*0.02 : 0);   // rookies sometimes spray it
  o.speed *= 1 + gauss()*err*0.08; o.axis *= 1 + gauss()*err*0.4;
  return o;
}
function cpuThrow(){
  const o = cpuPlan; posX = o.x; bowler.root.position.x = bowlerX();
  state = 'approach'; camMode = 'approach'; approachT = 0; cpuPlan.auto = true;
}

// ---- bowler animation ----
function poseBowler(t, arg){ // t: 0 standing … 1 release at the foul line
  const B = bowler, hand = settings.hand;
  const step = Math.min(1, t)*4, ph = step*Math.PI;
  B.legs[0].rotation.x = Math.sin(ph)*0.5*(t < 1 ? 1 : 0) + (t >= 0.95 ? -0.6 : 0);
  B.legs[1].rotation.x = -Math.sin(ph)*0.5*(t < 1 ? 1 : 0) + (t >= 0.95 ? 0.9 : 0);
  const armI = hand > 0 ? 1 : 0, other = 1 - armI;
  // swing: back on steps 2-3, forward at the slide
  const sw = t < 0.3 ? -t*1.5 : t < 0.75 ? -0.45 + (t - 0.3)*(-3.4) : -1.98 + (t - 0.75)*10.5;
  B.arms[armI].rotation.x = arg ? (arg.fwd > 0 ? -arg.max*1.9 + arg.fwd*(arg.max*1.9 + 0.7) : -arg.back*1.9) : Math.max(-2.1, Math.min(0.9, sw));
  B.arms[other].rotation.x = -0.3*Math.sin(ph); B.arms[other].rotation.z = -hand*0.5*Math.min(1, t*2);
  B.body.rotation.x = -Math.min(0.5, t*0.6);
  B.body.position.y = -Math.min(0.18, t*0.2);
  B.root.rotation.y = 0;
}
function handPos(){ bowler.root.updateMatrixWorld(true); const armI = settings.hand > 0 ? 1 : 0, h = bowler.arms[armI]; const v = new THREE.Vector3(0, -0.6, 0); h.localToWorld(v); return v; }

// ================= main loop =================
const clock = new THREE.Clock();
let lastEvN = 0;
function frame(){

}
function frameBody(){
  const dt = Math.min(0.05, clock.getDelta());
  if(state==='approach'){
    approachT += dt;
    let t;
    if(cpuPlan && cpuPlan.auto){ t = Math.min(1.05, approachT/APPROACH); poseBowler(t); }
    else { t = settings.ring ? Math.min(0.97, approachT/APPROACH) : Math.min(0.62, swing.max*0.62) + swing.fwd*0.38; poseBowler(Math.min(0.95, t), swing); }
    bowler.root.position.z = 3.4 - 2.85*Math.min(1, t);
    if(cpuPlan && cpuPlan.auto && approachT >= APPROACH - 0.03 + (Math.random() - 0.5)*0.02){ const o = cpuPlan; cpuPlan = null; release(Object.assign({}, o, {note:o.remote ? o.note : ''})); }
    else if(approachT > 6 && !(cpuPlan && cpuPlan.auto)){ ptr.id = null; state = 'aim'; camMode = 'aim'; bowler.root.position.z = 3.4; poseBowler(0); hint('Touch the ball, <b>pull back</b>, then <b>swing up</b> and let go'); }
  }

    lastEvN = ev.length; if(ev.length > 400){ world.events = []; lastEvN = 0; }
    const b = world.ball; setRumble(b && !b.gone ? Math.min(0.5, Math.hypot(b.vx, b.vz)*0.05) : 0);
    if(world.done && state==='roll' && remoteThrow && !netResults[remoteThrow.n] && (remoteThrow.waitT = (remoteThrow.waitT || 0) + dt) < 2.5){ hint(`Waiting for ${esc(curP().name)}'s result…`); }
    else if(world.done && state==='roll'){

function endGame(){
  state = 'over';
  const res = players.map(p=>({p, t:E.scoreGame(p.rolls).total})).sort((a,b)=>b.t - a.t);
  let best = 0; try{ best = +localStorage.getItem(BEST_KEY) || 0; }catch(e){}
  const humanTop = Math.max(...players.filter(p=>!p.cpu).map(p=>E.scoreGame(p.rolls).total));
  const newBest = humanTop > best; if(newBest) try{ localStorage.setItem(BEST_KEY, humanTop); }catch(e){}
  const strikes = p=>{ let n = 0; E.scoreGame(p.rolls).frames.forEach(f=>{ n += (f.rolls || []).filter((v,k)=>v===10 && (k===0 || !f.tenth || f.rolls[k-1]===10 || (k===2 && f.rolls[0]+f.rolls[1]===10))).length; }); return n; };
  const tie = players.length > 1 && res[0].t===res[1].t;
  if(players.length > 1 && !tie && !series.counted){ series.wins[players.indexOf(res[0].p)]++; series.counted = true; }
  const need = Math.floor(series.best/2) + 1, champ = players.findIndex((p,i)=>series.wins[i] >= need);
  const seriesOn = series.best > 1, seriesDone = !seriesOn || champ >= 0;
  $('endTitle').textContent = players.length > 1 ? (seriesOn && champ >= 0 ? `🏆 ${players[champ].name} wins the series!` : tie ? "It's a tie!" : `${res[0].p.name} wins${seriesOn ? ' game ' + series.game : ''}!`) : 'Game over';
  $('endBody').innerHTML = (players.length===1 ? `<div class="big">${res[0].t}</div>` : '') + (newBest ? '<p style="text-align:center;font-weight:700;color:#e08a00">🏆 New personal best!</p>' : best ? `<p style="text-align:center;opacity:.75">Best: ${best}</p>` : '') +
    `<table class="sc">${res.map((r,i)=>`<tr><td>${i===0 && players.length > 1 && !tie ? '🏆' : ''}</td><td>${esc(r.p.name)}</td><td>${strikes(r.p)} X</td><td style="text-align:right;font-weight:700;font-size:16px">${r.t}</td></tr>`).join('')}</table>` +
    (seriesOn ? `<p style="text-align:center;margin:8px 0 2px;font-weight:600">Best of ${series.best} · games won</p><p style="text-align:center;margin:0;font-size:17px">${players.map((p,i)=>`${esc(p.name)} <b>${series.wins[i]}</b>`).join(' · ')}</p>` : '');
  $('end').classList.remove('hidden');
  const canStart = mode!=='online' || net.host;
  $('endAgain').textContent = seriesDone ? (players.length > 1 ? '🔁 Rematch' : 'Play again') : `▶ Next game (${series.game + 1} of up to ${series.best})`;
  $('endAgain').dataset.next = seriesDone ? '' : '1';
  $('endAgain').classList.toggle('hidden', !canStart);
  $('endWait').classList.toggle('hidden', canStart);
  $('endWait').textContent = seriesDone ? 'Waiting for the host to start a rematch…' : 'Waiting for the host to start the next game…';
  recordGames().then(out=>{ const ranked = out.filter(e=>e.rank); if(ranked.length && !$('end').classList.contains('hidden')) $('endBody').insertAdjacentHTML('beforeend', ranked.map(e=>`<p style="text-align:center;font-weight:600;margin:4px 0">🌍 ${esc(e.name)}: ${e.rank===1 ? '<b>top of the world leaderboard!</b>' : 'number ' + e.rank + ' on the world leaderboard'}</p>`).join('')); }).catch(()=>{});
  if(mode==='online') saveSession();
}
$('endAgain').onclick = ()=>{
  const next = !!$('endAgain').dataset.next, ser = next ? {best:series.best, wins:series.wins.slice(), game:series.game + 1} : null;
  // a new game starts with whoever lost going first
  $('end').classList.add('hidden');
  if(mode==='online'){ const seed = 1 + Math.floor(Math.random()*1e6), s2 = ser || {best:series.best, wins:players.map(()=>0), game:1}; netSend({t:'start', lobby:net.lobby, seed, series:s2}); launchOnline(net.lobby, seed, s2); return; }

};

// ================= online play (MQTT relay, same approach as Disc Golf) =================
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const CODE_CH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', SESSION_KEY = 'strikenight-online';
const net = {client:null, host:false, id:'', code:'', topic:'', broker:0, lobby:[], started:false, away:{}, seq:0};
let pendingSync = [], replayChecks = {n:0, bad:0};
let myIdx = 0, remoteThrow = null, myThrowN = 0, netQueue = [], netResults = {};
function newId(){ return Array.from({length:10}, ()=>'abcdefghijkmnopqrstuvwxyz23456789'[Math.floor(Math.random()*33)]).join(''); }
function olStatus(t){ $('olStatus').textContent = t; }
function libReady(){ if(window.mqtt) return true; olStatus('Online play needs the GitHub Pages version of the game (it can\'t connect from inside Claude).'); return false; }
function myName(){ const n = ($('olName').value || '').trim() || settings.names[0] || 'Player'; settings.names[0] = n.slice(0,12); saveSettings(); return n.slice(0,12); }
function topicFor(code){ return 'strike-night-skoorbydna/v1/' + code; }
function netSend(msg){ if(!net.client) return; msg.from = net.id; try{ net.client.publish(net.topic, JSON.stringify(msg), {qos:1}); }catch(e){} }
let wakeLock = null;
async function keepAwake(){ try{ if(navigator.wakeLock && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock = null; }); } }catch(e){} }
function netClose(){
  if(net.client){ try{ net.client.publish(net.topic, JSON.stringify({t:'bye', from:net.id}), {qos:1}); }catch(e){} const c = net.client; setTimeout(()=>{ try{ c.end(true); }catch(e){} }, 300); }
  Object.assign(net, {client:null, host:false, code:'', topic:'', lobby:[], started:false, away:{}, seq:0});
  try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null;
}
function connectBroker(i, code){
  return new Promise(res=>{
    const topic = topicFor(code); let done = false;
    const c = window.mqtt.connect(BROKERS[i], {clientId:'sn_' + net.id, clean:false, keepalive:20, reconnectPeriod:2500, connectTimeout:8000, will:{topic, payload:JSON.stringify({t:'bye', from:net.id}), qos:1, retain:false}});
    const fail = ()=>{ if(done) return; done = true; try{ c.end(true); }catch(e){} res(null); };
    const timer = setTimeout(fail, 9000);
    c.on('connect', ()=>{ c.subscribe(topic, {qos:1}, err=>{ if(done) return; if(err) return fail(); done = true; clearTimeout(timer); res(c); }); if(net.client===c && net.started) netSend({t:'back'}); });
    c.on('error', ()=>{});
    c.on('message', (t, buf)=>{ let m; try{ m = JSON.parse(buf.toString()); }catch(e){ return; } if(m.from===net.id) return; onNet(m); });
  });
}
function inviteURL(){ return location.origin + location.pathname + '?join=' + net.code + '&b=' + net.broker; }
function renderLobby(){
  $('olPlayers').innerHTML = net.lobby.map((p,i)=>`<tr><td>🎳</td><td>${esc(p.name)}${i===0 ? ' (host)' : ''}${p.pid===net.id ? ' · you' : ''}</td></tr>`).join('');
  $('olGo').classList.toggle('hidden', !net.host); $('olWhatsApp').classList.toggle('hidden', !net.host); $('olMore').classList.toggle('hidden', !net.host);
  $('olSeries').classList.toggle('hidden', !net.host); if(net.host) seriesChips($('olSeries'));
  $('olGo').disabled = net.lobby.length < 2; $('olGo').style.opacity = net.lobby.length < 2 ? 0.5 : 1;
}
async function hostGame(){
  if(!libReady()) return; netClose();
  net.id = newId(); net.host = true; net.code = Array.from({length:4}, ()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join(''); net.topic = topicFor(net.code);
  olStatus('Setting up…');
  for(let i=0;i<BROKERS.length;i++){ const c = await connectBroker(i, net.code); if(!net.host){ if(c) c.end(true); return; } if(c){ net.client = c; net.broker = i; break; } }
  if(!net.client){ net.host = false; olStatus('Couldn\'t reach the game server. Check your internet connection and try again.'); return; }
  net.lobby = [{name:myName(), pid:net.id}];
  $('olCodeShow').textContent = net.code; $('olStart').classList.add('hidden'); $('olLobby').classList.remove('hidden');
  olStatus('Send the invite, then wait for players to join…'); renderLobby(); keepAwake();
}
async function joinGame(codeArg, hint_){
  if(!libReady()) return;
  const code = (codeArg || $('olCode').value).trim().toUpperCase(); if(code.length !== 4){ olStatus('Type the 4-letter code from the host.'); return; }
  netClose(); net.id = newId(); net.code = code; net.topic = topicFor(code);
  const order = hint_==1 ? [1,0] : [0,1], token = net.id;
  for(const i of order){
    olStatus(i===order[0] ? 'Connecting…' : 'Still trying… (second server)');
    const c = await connectBroker(i, code); if(net.id !== token){ if(c) c.end(true); return; } if(!c) continue;
    net.client = c; net.broker = i; netSend({t:'hello', name:myName()});
    const ok = await new Promise(r=>{ const tm = setTimeout(()=>r(false), 6000); net.onLobby = ()=>{ clearTimeout(tm); r(true); }; });
    net.onLobby = null; if(ok){ keepAwake(); return; }
    try{ c.end(true); }catch(e){} net.client = null;
  }
  olStatus('No game found with that code. Check the code, and make sure the host still has the game open.');
}
function onNet(m){
  if(m.t==='full'){ if(m.to===net.id) olStatus('That game is full or has already started.'); return; }
  if(m.t==='hello' && net.host){
    if(net.lobby.some(p=>p.pid===m.from)){ netSend({t:'lobby', lobby:net.lobby}); return; }
    if(net.started || net.lobby.length >= 4){ netSend({t:'full', to:m.from}); return; }
    net.lobby.push({name:String(m.name || 'Player').slice(0,12), pid:m.from}); renderLobby(); netSend({t:'lobby', lobby:net.lobby}); olStatus(`${net.lobby.length} players ready`); return;
  }
  if(m.t==='lobby'){
    if(!m.lobby.some(p=>p.pid===net.id)) return;
    net.lobby = m.lobby; if(net.onLobby) net.onLobby();
    $('olCodeShow').textContent = net.code; $('olStart').classList.add('hidden'); $('olLobby').classList.remove('hidden');
    if(!net.started) olStatus('Joined! Waiting for the host to start…'); renderLobby(); return;
  }
  if(m.t==='bye'){
    const i = net.lobby.findIndex(p=>p.pid===m.from); if(i < 0) return;
    if(!net.started){ if(net.host){ net.lobby.splice(i,1); renderLobby(); netSend({t:'lobby', lobby:net.lobby}); } else if(i===0) olStatus('The host closed the game.'); return; }
    net.away[m.from] = Date.now(); flash(`${esc(net.lobby[i].name)} lost connection…`, 2);
    if(net.host) setTimeout(()=>{ if(net.away[m.from] && Date.now() - net.away[m.from] >= 59000){ netSend({t:'left', idx:i}); onNet({t:'left', idx:i}); } }, 60000);
    return;
  }
  if(m.t==='back'){ if(net.away[m.from]){ delete net.away[m.from]; const i = net.lobby.findIndex(p=>p.pid===m.from); if(i >= 0) flash(`${esc(net.lobby[i].name)} is back`, 1.5); } return; }
  if(m.t==='start'){ if(!net.started || state==='over') launchOnline(m.lobby, m.seed, m.series); return; }
  if(m.t==='sync'){ if(m.to===net.id) applySync(m.snap); return; }
  if(!net.started) return;
  if(m.t==='left'){ const p = players[m.idx]; if(!p || p.gone) return; p.gone = true; flash(`${esc(p.name)} left the game`, 2); if(state==='remote' && cur===m.idx) startTurn(); return; }
  if(m.t==='throw'){ if(m.n <= (net.seq||0) || netQueue.some(q=>q.n===m.n)) return; netQueue.push(m); processNet(); return; }
  if(m.t==='result'){ netResults[m.n] = {knocked:m.knocked|0, standing:(m.standing || []).map(Number)}; return; }
  if(m.t==='syncreq'){ if(!players.length) return; if(['approach','roll','result'].includes(state)){ pendingSync.push(m.from); return; } netSend({t:'sync', to:m.from, snap:makeSnap()}); return; }   // mid-ball: answer once it's scored
  if(m.t==='sync'){ if(m.to===net.id) applySync(m.snap); return; }
}
function processNet(){
  if(state!=='remote') return;
  netQueue.sort((a,b)=>a.n - b.n);
  const k = netQueue.findIndex(q=>q.idx===cur && q.n > (net.seq||0)); if(k < 0) return;
  const m = netQueue.splice(k, 1)[0]; net.seq = m.n; remoteThrow = m;
  posX = m.p.x; bowler.root.position.x = bowlerX();
  state = 'approach'; camMode = 'approach'; approachT = 0;
  cpuPlan = Object.assign({}, m.p, {auto:true, remote:true, note:`${curP().name} bowls…`});
}
function launchOnline(lobby, seed, ser){
  $('end').classList.add('hidden');
  net.started = true; net.lobby = lobby; myIdx = lobby.findIndex(p=>p.pid===net.id);
  $('online').classList.add('hidden'); keepAwake();
  netQueue = []; netResults = {}; net.seq = 0;
  startGame('online', lobby.map(p=>({name:p.name})), seed, ser || {best:1, wins:lobby.map(()=>0), game:1});
}
function makeSnap(){ return {series, over:state==='over', lobby:net.lobby, seed:gameSeed, seq:net.seq, cur, rolls:players.map(p=>p.rolls), left:players.map(p=>p.left), gone:players.map(p=>!!p.gone), results:netResults}; }
function applySync(sn){
  if(!sn || !sn.lobby) return;
  net.lobby = sn.lobby; net.started = true; myIdx = sn.lobby.findIndex(p=>p.pid===net.id); netResults = sn.results || {};
  mode = 'online'; gameSeed = sn.seed; if(sn.series) series = sn.series; players = sn.lobby.map((p,i)=>({name:p.name, cpu:null, color:i, rolls:sn.rolls[i] || [], left:sn.left[i] || null, gone:sn.gone[i]}));
  cur = sn.cur; net.seq = sn.seq; netQueue = []; remoteThrow = null;
  ['menu','online','setup','end','pause','how'].forEach(id=>$(id).classList.add('hidden'));
  flash('Back in the game', 1.4);
  if(players.every(q=>E.gameState(q.rolls).done)) endGame(); else startTurn();
}
function saveSession(){ if(!net.code) return; try{ localStorage.setItem(SESSION_KEY, JSON.stringify({at:Date.now(), id:net.id, host:net.host, code:net.code, broker:net.broker, started:net.started})); }catch(e){} }
function loadSession(){ try{ const s_ = JSON.parse(localStorage.getItem(SESSION_KEY)); return s_ && Date.now() - s_.at < 3*3600e3 ? s_ : null; }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
async function rejoin(sv){
  for(let k=0;k<30 && !window.mqtt;k++) await new Promise(r=>setTimeout(r, 200));
  if(!window.mqtt) return;
  Object.assign(net, {id:sv.id, host:sv.host, code:sv.code, topic:topicFor(sv.code), broker:sv.broker});
  const c = await connectBroker(sv.broker, sv.code) || await connectBroker(1 - sv.broker, sv.code);
  if(!c){ flash('Couldn\'t reconnect to the online game', 2); return; }
  net.client = c; keepAwake();
  if(sv.started){ flash('Reconnecting…', 1.5); netSend({t:'back'}); netSend({t:'syncreq'}); }
  else { openOnline(); if(!net.host) netSend({t:'hello', name:myName()}); }
}
function openOnline(code, hint_){
  $('olName').value = settings.names[0] || '';
  $('olStart').classList.remove('hidden'); $('olLobby').classList.add('hidden');
  $('olCode').value = code || ''; net.hint = hint_;
  olStatus(code ? 'You\'ve been invited! Type your name and tap Join.' : '');
  $('online').classList.remove('hidden');
  setTimeout(()=>{ if(!window.mqtt) libReady(); }, 3000);
}

$('olHost').onclick = hostGame;
$('olJoin').onclick = ()=>joinGame('', net.hint);
$('olGo').onclick = ()=>{ if(!net.host || net.lobby.length < 2) return; const seed = 1 + Math.floor(Math.random()*1e6), ser = {best:settings.series || 1, wins:net.lobby.map(()=>0), game:1}; netSend({t:'start', lobby:net.lobby, seed, series:ser}); launchOnline(net.lobby, seed, ser); };

$('olMore').onclick = async ()=>{ const url = inviteURL(); try{ if(navigator.share){ await navigator.share({title:'Strike Night', text:`Join my bowling game (code ${net.code}) 🎳`, url}); return; } }catch(e){ return; } try{ await navigator.clipboard.writeText(url); olStatus('Invite link copied'); }catch(e){ olStatus(url); } };

function cloudQ(){ try{ return JSON.parse(localStorage.getItem(cloud.Q)) || []; }catch(e){ return []; } }
function cloudSetQ(q){ try{ localStorage.setItem(cloud.Q, JSON.stringify(q.slice(-30))); }catch(e){} }
async function cloudFlush(){
  const q = cloudQ(); if(!q.length) return; const db = await cloudInit(), left = [];
  for(const it of q){ try{ await db.collection('sn_games').add({n:it.n, s:it.s, st:it.st, how:it.how, t:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){ if(e && e.code==='permission-denied') continue; left.push(it); } }
  cloudSetQ(left);
}
setTimeout(()=>{ if(cloudQ().length) cloudFlush().catch(()=>{}); }, 4000);
function loadGames(){ try{ return JSON.parse(localStorage.getItem(LB_KEY)) || []; }catch(e){ return []; } }
function strikesOf(p){ let n = 0; E.scoreGame(p.rolls).frames.forEach(f=>{ n += (f.rolls || []).filter((v,k)=>v===10 && (k===0 || !f.tenth || f.rolls[k-1]===10 || (k===2 && f.rolls[0]+f.rolls[1]===10))).length; }); return n; }
// record finished human games; share each player's new personal best
async function recordGames(){
  if(mode==='practice') return [];
  const how = mode==='cpu' ? 'vs ' + (players.find(p=>p.cpu) || {}).name : mode==='online' ? 'Online' : mode==='pass' ? 'Pass & play' : 'Solo';
  const games = loadGames(), out = [];
  players.forEach((p,i)=>{
    if(p.cpu || p.gone || (mode==='online' && i!==myIdx)) return;
    const s_ = E.scoreGame(p.rolls).total, st = strikesOf(p), pb = Math.max(0, ...games.filter(g=>g.name===p.name).map(g=>g.s));
    const e = {name:p.name, s:s_, st, how:how.slice(0,30), when:Date.now()}; games.push(e);
    if(s_ > pb && s_ > 0) cloudSetQ(cloudQ().concat([{n:p.name.slice(0,14), s:s_, st, how:how.slice(0,30)}]));
    out.push(e);
  });
  games.sort((a,b)=>b.s - a.s || a.when - b.when);
  try{ localStorage.setItem(LB_KEY, JSON.stringify(games.slice(0, 30))); }catch(e){}
  try{ await cloudFlush(); const db = await cloudInit();
    for(const e of out){ const better = (await db.collection('sn_games').where('s', '>', e.s).count().get()).data().count; e.rank = better + 1; }
  }catch(err){}
  return out;
}
let boardWho = 'world', boardReq = 0;
function renderBoard(){
  document.querySelectorAll('[data-bw]').forEach(b=>{ b.classList.toggle('on', b.dataset.bw===boardWho); b.onclick = ()=>{ boardWho = b.dataset.bw; renderBoard(); }; });
  const d = t=>new Date(t).toLocaleDateString(undefined, {day:'numeric', month:'short'});
  const draw = rows=>{ $('boardList').innerHTML = rows.length ? rows.slice(0,10).map((e,i)=>`<tr><td>${i===0 ? '🏆' : i+1}</td><td>${esc(e.name)}<br><span style="font-size:11px;opacity:.7">${esc(e.how)} · ${e.st} strike${e.st===1 ? '' : 's'} · ${d(e.when)}</span></td><td style="text-align:right;font-weight:700;font-size:17px">${e.s}</td></tr>`).join('') : '<tr><td>–</td><td>No games yet. Finish a game to get on the board!</td><td></td></tr>'; };
  $('boardFoot').textContent = boardWho==='world' ? 'Everyone\'s best games, from every phone. Practice doesn\'t count.' : 'Every finished game on this phone.';
  if(boardWho==='phone'){ draw(loadGames()); return; }
  const my = ++boardReq; $('boardList').innerHTML = '<tr><td>…</td><td>Loading…</td><td></td></tr>';
  cloudInit().then(db=>db.collection('sn_games').orderBy('s', 'desc').limit(10).get()).then(snap=>{ if(my!==boardReq) return;
    draw(snap.docs.map(x=>({name:String(x.get('n') || 'Player'), s:Number(x.get('s')), st:Number(x.get('st') || 0), how:String(x.get('how') || ''), when:(x.get('t') && x.get('t').toMillis) ? x.get('t').toMillis() : Date.now()}))); })
    .catch(()=>{ if(my===boardReq) $('boardList').innerHTML = '<tr><td>📡</td><td>Couldn\'t reach the leaderboard. Check your connection, or look at This phone.</td><td></td></tr>'; });
}
$('mBoard').onclick = ()=>{ renderBoard(); $('board').classList.remove('hidden'); };
$('boardClose').onclick = ()=>$('board').classList.add('hidden');

// idle scene behind the menu
world = E.newWorld(); bowler.root.position.set(bowlerX(), 0, 3.4); poseBowler(0);
camera.position.copy(camPos); camera.lookAt(camLook);
if(!/\/bowling\/?/.test(location.pathname)) $('mFrisbee').classList.add('hidden');     // the link back only makes sense on the GitHub site
{ const q = new URLSearchParams(location.search), j = q.get('join'), sv = loadSession();
  if(sv && (!j || j.toUpperCase()===sv.code)) rejoin(sv);
  else if(j){ history.replaceState(null, '', location.pathname); openOnline(j.toUpperCase().slice(0,4), q.get('b')); } }
frame();
window.__dbg = ()=>({checks:replayChecks, results:netResults, seq:net.seq, rt:remoteThrow && remoteThrow.n, q:netQueue.length, pend:pendingSync.length, done:world && world.done});
window.__tp = {get state(){ return state; }, get world(){ return world; }, get players(){ return players; }, get cur(){ return cur; }, startGame, release, paramsFromSwipe, analyseSwipe, set approachT(v){ approachT = v; }, get mode(){ return mode; }};
})();
